[project]
name = "ahead-of-time-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chdb>=4.5.1",
    "langfuse>=5.2.0",
    "mistralai>=3.8.0",
    "pandas>=3.1.1",
    "timestral",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
