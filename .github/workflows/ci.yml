name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: |
          uv sync --frozen
          npm ci
      - name: Tests (no network, no model weights)
        run: uv run pytest -q
      - name: Cache Timestral weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/huggingface
          key: timestral-123m-5a147287addda85f6acd8da3fb8858fe9af7e8f7
      - name: Replay the preregistered backtest on the frozen data
        run: uv run python -m aot.backtest --check
