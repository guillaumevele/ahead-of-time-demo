name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (locked)
        run: |
          uv sync --frozen
          npm ci
      - name: Tests (no network, no model weights)
        run: uv run pytest -q
      - name: Cache Timestral weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: timestral-123m-5a147287addda85f6acd8da3fb8858fe9af7e8f7
      - name: Replay the preregistered backtest on the frozen data
        run: uv run python -m aot.backtest --check
